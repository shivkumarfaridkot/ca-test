function mcqPrompt(k,tp,n,part){const c=SUB[k];
 return `You are an ICAI CA Foundation question setter. Subject: ${c.full}. Today's topics: ${tp}.
Write ${n} multiple-choice questions strictly on these topics, in ICAI exam style, difficulty: ${diff()}. ${k==="maths"?"Mostly numerical questions; compute every answer carefully and double-check it.":"Mix conceptual and applied questions."} ${part===2?"This is batch 2 of 2: cover different sub-topics and angles than an obvious first set.":"This is batch 1 of 2."} Random seed: ${Math.random().toString(36).slice(2,8)}.
Each question has exactly 4 options. Spread the correct answer positions randomly. Use plain text only (x^2, sqrt(x)), no markdown or LaTeX.
Return ONLY a JSON array: [{"q":"question","o":["A","B","C","D"],"a":0,"w":"one or two line explanation","t":"short topic name, max 5 words"}] where a is the 0-based index of the correct option.`}
function wPrompt(k,tp){const c=SUB[k];
 return k==="acc"?`You are an ICAI CA Foundation question setter. Subject: ${c.full}. Today's topics: ${tp}.
Write 4 written practice questions on these topics (numerical problems with figures where the topic allows, 5 to 8 marks each, difficulty: ${diff()}). Give a complete model solution with working steps in plain text. Check all arithmetic. No markdown or LaTeX. Random seed: ${Math.random().toString(36).slice(2,8)}.
Return ONLY a JSON array: [{"q":"question","m":"marks","a":"model solution"}].`
 :`You are an ICAI CA Foundation question setter. Subject: ${c.full}. Today's topics: ${tp}.
Write 4 case-study style questions on these topics (short fact situation, then 1 to 2 questions to answer with reasoning, as in the ICAI Law paper), difficulty: ${diff()}. Give a model answer citing the relevant sections and principles in plain text. No markdown. Random seed: ${Math.random().toString(36).slice(2,8)}.
Return ONLY a JSON array: [{"q":"fact situation and question","m":"marks","a":"model answer"}].`}
async function ask(sample,p){const v=await sample.json(p,{cache:false});if(!Array.isArray(v))throw new Error("Unexpected reply, please retry.");return v}
async function genSub(k,sample){
 const c=SUB[k],tp=cur.t[c.tk];busy[k]=1;err[k]="";render();
 try{let out;
  if(c.kind==="mcq"){out=(await Promise.all((prov()==="g"?[1]:[1,2]).map(i=>ask(sample,mcqPrompt(k,tp,prov()==="g"?30:15,i))))).flat().filter(x=>x&&x.q&&Array.isArray(x.o)&&x.o.length===4&&Number.isInteger(x.a)&&x.a>=0&&x.a<4)}
  else out=(await ask(sample,wPrompt(k,tp))).filter(x=>x&&x.q&&x.a);
  if(!out.length)throw new Error("No usable questions came back, please retry.");
  st.data[k]=out;st.sel[k]=st.sel[k]&&c.kind==="mcq"?{}:st.sel[k];save();
 }catch(e){err[k]=e&&e.code==="not_granted"?"API key was rejected. Check it in Settings.":e&&e.code==="rate_limited"?"Too many requests right now. Wait a minute and retry.":(e&&e.message)||"Could not generate. Please retry."}
 busy[k]=0;render();
}
async function sampleOrNull(){return keyNow()?{json:callApi}:null}
async function genAll(){
 const s=await sampleOrNull();
 if(!s){err.all="Add your API key in Settings first.";render();return}
 err.all="";const nt=st.notes;st=fresh(st.date);st.notes=nt;
 await genSub("acc",s);
 if(err.acc&&/rejected/.test(err.acc))return;
 if(prov()==="g"){for(const k of ["maths","eco","law"])await genSub(k,s)}else await Promise.all(["law","maths","eco"].map(k=>genSub(k,s)));
 if(!ls("ca-tf-"+st.date,[]).length){try{lsSet("ca-tf-"+st.date,await tfData(cur.t.acc))}catch(e){}}
}
async function retry(k){const s=await sampleOrNull();if(s)genSub(k,s)}

function mcqCard(k,i){
 const q=st.data[k][i],sel=st.sel[k],done=sel[i]!=null;
 const box=h("div",{class:"card"},h("div",{class:"n"},"Question "+(i+1)),h("p",{class:"q"},q.q));
 q.o.forEach((o,j)=>{
  let cls="opt";if(done){if(j===q.a)cls+=" ok";else if(j===sel[i])cls+=" bad"}
  box.append(h("button",{class:cls,onclick:()=>{if(sel[i]!=null)return;sel[i]=j;record(k,q,j===q.a);save();box.replaceWith(mcqCard(k,i));score(k);stk()}},"ABCD"[j]+". "+o));
 });
 if(done&&q.w)box.append(h("div",{class:"why"},q.w));
 box.append(doubtUi(k,i,q));
 return box;
}
function score(k){const el=$("#score");if(!el||!st.data[k]||!st.sel[k])return;const qs=st.data[k],s=st.sel[k];let r=0;for(const i in s)if(qs[i]&&s[i]===qs[i].a)r++;
 const tm=st.tm[k];let ts="";if(tm){const fin=Object.keys(s).length>=qs.length,ms=(fin?tm.e:Date.now())-tm.s;ts=" · "+Math.floor(ms/60000)+":"+String(Math.floor(ms/1000)%60).padStart(2,"0")+(fin?" (finished)":"")}
 el.textContent="Score "+r+" / "+Object.keys(s).length+" answered, out of "+qs.length+ts}
function wCard(k,i){
 const q=st.data[k][i],open=st.rev[k][i];
 const box=h("div",{class:"card"},h("div",{class:"n"},"Question "+(i+1)+(q.m?" · "+q.m+" marks":"")),h("p",{class:"q"},q.q),
  h("button",{class:"btn alt",onclick:()=>{st.rev[k][i]=!st.rev[k][i];save();box.replaceWith(wCard(k,i))}},open?"Hide answer":"Show answer"));
 if(open)box.append(h("div",{class:"ans"},q.a));
 box.append(doubtUi(k,i,q));
 return box;
}

function streak(){const days=ls("ca-days",{});let d=today,n=0;if((days[d]||0)<10)d=addDays(d,-1);while((days[d]||0)>=10){n++;d=addDays(d,-1)}return n}

async function callApi(p){

 const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":keyNow(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:ls("ca-model","claude-sonnet-5-5"),max_tokens:8000,messages:[{role:"user",content:p}]})});

 const d=await r.json();const t=d.content.map(x=>x.text||"").join("");
 return JSON.parse(t.replace(/```json|```/g,"").trim());
}
